name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore OtaTool.sln
      - run: dotnet build OtaTool.sln -c Release --no-restore
      - run: dotnet run --project tests/OtaTool.Core.SmokeTests/OtaTool.Core.SmokeTests.csproj -c Release --no-build
      - run: dotnet run --project tests/OtaTool.Update.Tests/OtaTool.Update.Tests.csproj -c Release --no-build
